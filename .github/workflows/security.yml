name: PHP security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Check shared JavaScript and package-builder syntax
        run: |
          node --check scripts/layout.js
          node --check scripts/catalog-ui.js
          python3 -m py_compile tools/package-release.py
      - name: Reject committed configuration and credentials
        run: php tools/check-secrets.php --all
  backend-database:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: ['mariadb:10.4', 'mysql:8.0']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Database, security, UI and Week 9 edge-case matrix
        env:
          OMDB_DB_SERVER: '127.0.0.1'
          OMDB_DB_USER: root
          OMDB_DB_PASS: ''
          OMDB_DB_NAME: unused_configuration
        run: python3 tests/run_week9.py --php php --mysql mysql --output "${{ runner.temp }}/omdb-week9-results"
      - name: Record expected and actual test results
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/omdb-week9-results/matrix.md" ]; then
            cat "${{ runner.temp }}/omdb-week9-results/matrix.md" >> "$GITHUB_STEP_SUMMARY"
          fi
  deployment-package:
    needs: lint-and-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and verify the source-only deployment ZIP
        run: python3 tools/package-release.py --output "${{ runner.temp }}/omdb2-final.zip"
      - name: Save deployment ZIP and commit/checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omdb2-final-${{ github.sha }}
          path: |
            ${{ runner.temp }}/omdb2-final.zip
            ${{ runner.temp }}/omdb2-final.manifest.json
          if-no-files-found: error
          retention-days: 14
