name: PHP security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
      - name: Reject committed configuration and credentials
        run: php tools/check-secrets.php --all
